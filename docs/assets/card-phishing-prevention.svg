<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Phishing Prevention">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" rx="18" fill="url(#bg)"/>
  <rect width="800" height="400" rx="18" fill="url(#grid)"/>
  <rect x="0" y="40" width="7" height="320" fill="#B45309"/>
  <rect x="48" y="44" width="265" height="33" rx="16.5" fill="#B45309" fill-opacity="0.18" stroke="#B45309" stroke-width="1.5"/><text x="180.5" y="66" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#F9FAFB">US PATENT 12,445,488 B2</text>
  <path d="M700 58 L730 70 V94 C730 114 716 126 700 132 C684 126 670 114 670 94 V70 Z" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="3"/><path d="M688 94 L697 104 L714 84" fill="none" stroke="#F9FAFB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F9FAFB">Phishing Prevention</text>
  <text x="48" y="196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">Catches look-alike login pages by recognizing the</text><text x="48" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">brand they imitate, then checking whether the page</text><text x="48" y="264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">is really hosted by that brand.</text>
  <rect x="48" y="318" width="183" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="139.5" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">Chrome Extension</text><rect x="241" y="318" width="58" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="270.0" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">CNN</text><rect x="309" y="318" width="78" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="348.0" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">Flask</text>
  <text x="752" y="342" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#60A5FA">View repository &#8594;</text>
</svg>
