<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Trusted Repeater">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" rx="18" fill="url(#bg)"/>
  <rect width="800" height="400" rx="18" fill="url(#grid)"/>
  <rect x="0" y="40" width="7" height="320" fill="#B45309"/>
  <rect x="48" y="44" width="265" height="33" rx="16.5" fill="#B45309" fill-opacity="0.18" stroke="#B45309" stroke-width="1.5"/><text x="180.5" y="66" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#F9FAFB">US PATENT 12,598,158 B2</text>
  <circle cx="662" cy="92" r="17" fill="#B45309" fill-opacity="0.25" stroke="#B45309" stroke-width="3"/><circle cx="738" cy="92" r="17" fill="#15803D" fill-opacity="0.25" stroke="#15803D" stroke-width="3"/><rect x="688" y="66" width="24" height="52" rx="5" fill="#2563EB" fill-opacity="0.25" stroke="#2563EB" stroke-width="3"/><line x1="679" y1="92" x2="688" y2="92" stroke="#CBD5E1" stroke-width="3"/><line x1="712" y1="92" x2="721" y2="92" stroke="#CBD5E1" stroke-width="3"/>
  <text x="46" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F9FAFB">Trusted Repeater</text>
  <text x="48" y="196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">Stops covert data exfiltration by rebuilding every</text><text x="48" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">outbound packet with a known-safe payload, so hidden</text><text x="48" y="264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">data never leaves.</text>
  <rect x="48" y="318" width="78" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="87.0" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">Scapy</text><rect x="136" y="318" width="97" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="184.5" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">tcpdump</text><rect x="243" y="318" width="116" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="301.0" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">Cisco IOS</text>
  <text x="752" y="342" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#60A5FA">View repository &#8594;</text>
</svg>
